apiVersion: v1
kind: ServiceAccount
metadata:
  name: codex-agent
  namespace: codex-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: codex-agent-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: codex-agent
    namespace: codex-system

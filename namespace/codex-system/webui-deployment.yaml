apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-webui
  namespace: codex-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: codex-webui
  template:
    metadata:
      labels:
        app: codex-webui
    spec:
      serviceAccountName: codex-agent
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr-pull-secret
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - oci-sea-00
      containers:
        - name: webui
          image: ghcr.io/ikhwanperwira/codex-webui:latest
          imagePullPolicy: Always
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8899"
            - name: CODEX_HOME
              value: /home/codex/.codex
            - name: CODEX_WEBUI_PROJECTLESS
              value: "true"
          ports:
            - name: http
              containerPort: 8899
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: codex-config
              mountPath: /home/codex/.codex/config.toml
              subPath: config.toml
              readOnly: true
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: codex-config
          configMap:
            name: codex-config
        - name: workspace
          emptyDir: {}

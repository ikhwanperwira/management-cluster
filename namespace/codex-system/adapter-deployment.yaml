apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-adapter
  namespace: codex-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: codex-adapter
  template:
    metadata:
      labels:
        app: codex-adapter
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - oci-sea-00
      containers:
        - name: adapter
          image: ghcr.io/ikhwanperwira/codex-datadog-adapter:latest
          imagePullPolicy: Always
          args:
            - /run/auth/storage-state.json
          env:
            - name: ADAPTER_HOST
              value: "0.0.0.0"
            - name: ADAPTER_PORT
              value: "9000"
            - name: ADAPTER_HEADLESS
              value: "true"
            - name: ADAPTER_DUMP_DIR
              value: /captures
          ports:
            - name: http
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: storage-state
              mountPath: /run/auth/storage-state.json
              subPath: storage-state.json
              readOnly: true
            - name: captures
              mountPath: /captures
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: storage-state
          secret:
            secretName: codex-datadog-storage-state
        - name: captures
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
